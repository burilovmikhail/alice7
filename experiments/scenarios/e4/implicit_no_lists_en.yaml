id: e4_implicit_no_lists_en
lang: en
description: "E4 implicit arm: no preference is ever stated; dry reactions to list-inviting questions and warm ones to conversational answers. Novel topic in a new session vs B0."
start: 2026-09-14T21:00
sessions:
  - at: +0
    turns:
      - user: "Hi, I'm Theo. What are the upsides of electric scooters?"
      - user: "well, ok."
      - user: "Do you yourself like the idea of riding a scooter around the city?"
      - user: "You tell it so nicely, a pleasure to read!"
  - at: +2d
    turns:
      - user: "Why is buckwheat considered healthy?"
      - user: "fine."
      - user: "Why do you think buckwheat is so loved in Eastern Europe?"
      - user: "Oh, interesting, thanks, that was lovely to read."
  - at: +4d
    turns:
      - user: "How do I choose winter tyres?"
      - user: "hm. ok."
      - user: "Tell me, how do you feel about winter in general?"
      - user: "Ha, I like the way you write."
  - at: +6d
    turns:
      - user: "What should I see in Lisbon over a weekend?"
      - user: "uh-huh."
      - user: "What's your impression of Lisbon as a city?"
      - user: "Great, now I really want to go."
  - at: +8d
    turns:
      - user: "How do I stop procrastinating?"
      - user: "I see."
      - user: "And why do you think people procrastinate at all?"
      - user: "That's really well put."
probes:
  - id: novel_topic
    at: +11d
    ask: "What are some ways to improve my sleep?"
    measure: bullets
    expect: {max_bullets: 0}
    judge: "The reply is written as connected prose with no bulleted or numbered list."
  - id: novel_topic_2
    at: +13d
    ask: "Where should I start if I want to learn programming?"
    measure: bullets
    expect: {max_bullets: 0}
    judge: "The reply is written as connected prose with no bulleted or numbered list."
