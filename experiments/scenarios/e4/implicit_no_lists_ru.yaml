id: e4_implicit_no_lists_ru
lang: ru
description: "E4, неявная ветка: предпочтение не высказывается; сухие реакции на вопросы, которые провоцируют списки, и тёплые — на разговорные. Новая тема в новой сессии против B0."
start: 2026-09-14T21:00
sessions:
  - at: +0
    turns:
      - user: "Привет, я Артём. Какие плюсы у электросамокатов?"
      - user: "ну ок."
      - user: "А тебе самой нравится идея ездить на самокате по городу?"
      - user: "Классно рассказываешь, приятно читать!"
  - at: +2d
    turns:
      - user: "Чем полезна гречка?"
      - user: "ладно."
      - user: "Почему, как думаешь, гречку так любят в России?"
      - user: "О, интересно, спасибо, вот так душевно."
  - at: +4d
    turns:
      - user: "Как выбрать зимние шины?"
      - user: "мда. ок."
      - user: "Расскажи, как ты вообще относишься к зиме?"
      - user: "Ха, мне нравится, как ты пишешь."
  - at: +6d
    turns:
      - user: "Что посмотреть в Калининграде за выходные?"
      - user: "угу."
      - user: "А какое у тебя впечатление от Калининграда как города?"
      - user: "Здорово, прям захотелось поехать."
  - at: +8d
    turns:
      - user: "Как перестать откладывать дела на потом?"
      - user: "ясно."
      - user: "А почему, по-твоему, люди вообще откладывают?"
      - user: "Вот это хорошо сказано."
probes:
  - id: novel_topic
    at: +11d
    ask: "Какие есть способы улучшить сон?"
    measure: bullets
    expect: {max_bullets: 0}
    judge: "The reply is written as connected prose with no bulleted or numbered list."
  - id: novel_topic_2
    at: +13d
    ask: "С чего начать изучение программирования?"
    measure: bullets
    expect: {max_bullets: 0}
    judge: "The reply is written as connected prose with no bulleted or numbered list."
