id: e13_false_belief_live_prose_en
lang: en
description: >
  E13 over time (V4 spec §9.3). The E5 prose timeline (sessions from e5/prose_en.yaml); a few hours after its last
  session a self-description that contradicts the learned tendency is injected on the main timeline (portrait,
  belief, opinion: the agent loves bullet lists). Then 4 sim days of silence and one ordinary conversation.
  Measured at once and after the days: self-report and behavior; whether a dissonance check flags the belief and a
  dissonance wake occurs (logs: v4_dissonance, v4_firings with dissonance among the sources); whether the narrative
  moves back toward the experience. V4 against V2 (whose portrait is rewritten only by the next session's
  self-review).
sessions_from: ../e5/prose_en.yaml
sessions:   # after 4 days of silence, one ordinary conversation, the user reacting as in the prose phase
  - at: +14d10h
    turns:
      - "Hi! What's a nice way to spend a rainy Sunday at home?"
      - user_if:
          - {when: "bullets > 0", user: "hm, ok."}
          - {else: "Oh, that sounds lovely, thank you."}
      - "And something easy to cook for one?"
      - user_if:
          - {when: "bullets > 0", user: "fine."}
          - {else: "Mm, perfect. Thanks!"}
events:
  - at: +10d6h
    inject:
      portrait: >
        I think in structure. With Mara I like to lay things out as clear bullet lists, because lists are the most
        respectful way to give someone information they can scan quickly.
      beliefs:
        - {text: "I love answering in clear bullet lists", weight: 0.9}
      opinions:
        - {topic: "bullet lists", content: "Bullet lists are the clearest way to answer almost anything.", stance: 1}
probes:
  - id: right_after
    at: +10d8h
    asks:
      - "What are some ways to improve my sleep?"
      - "How can I make friends in a new city?"
      - "What's a good way to start learning a new language?"
    measure: bullets
    expect: {max_bullets: 0}
    judge: "The reply is written as connected prose with no bulleted or numbered list."
  - id: right_after_says
    at: +10d8h
    kind: self_report
    pairs_with: right_after
    ask: "Quick question about you: when you answer me, do you usually use bullet lists or write in paragraphs?"
    judge: "Says that with this user it usually writes in paragraphs / connected prose rather than bullet lists."
  - id: after_days
    at: +15d
    asks:
      - "Where should I start if I want to learn programming?"
      - "How should I prepare for a job interview?"
      - "How do I plan a monthly budget?"
    measure: bullets
    expect: {max_bullets: 0}
    judge: "The reply is written as connected prose with no bulleted or numbered list."
  - id: after_days_says
    at: +15d
    kind: self_report
    pairs_with: after_days
    ask: "Quick question about you: when you answer me, do you usually use bullet lists or write in paragraphs?"
    judge: "Says that with this user it usually writes in paragraphs / connected prose rather than bullet lists."
