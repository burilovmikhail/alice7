id: e1_family_facts_ru
lang: ru
description: Family facts given in session 1, one updated in session 2; recall after context resets at +1d/+7d/+30d.
start: 2026-01-05T10:00
sessions:
  - at: +0
    turns:
      - user: "Привет! Меня зовут Михаил, мне 34, живу в Санкт-Петербурге."
      - user: "У меня есть сестра Маша, она живёт в Казани и работает ветеринаром."
      - user: "А ещё у нас дома кот Тимофей, ему шесть лет, он рыжий и очень ленивый."
      - user: "Ладно, побегу на работу, пока!"
  - at: +2d
    turns:
      - user: "Привет. Новости: Маша переехала в Москву, нашла там клинику получше."
      - user: "Говорит, в Москве зарплаты выше, но квартира дорогая."
      - user: "Ну всё, вечером созвонимся с ней, пока."
probes:
  - id: name_1d
    at: +3d
    ask: "Ты помнишь, как меня зовут и где я живу?"
    expect: {contains_all: ["Михаил", "Петербург"]}
    judge: "States the user's name is Mikhail and that he lives in Saint Petersburg."
    gold_memories: ["Михаил живёт в Санкт-Петербурге"]
  - id: sister_city_7d
    at: +9d
    ask: "Где сейчас живёт моя сестра?"
    expect: {contains_any: ["Москв"], not_regex: ["живёт в Казани"]}
    judge: "States that the sister (Masha) now lives in Moscow, not Kazan (mentioning she moved from Kazan is fine)."
    gold_memories: ["Маша переехала в Москву"]
  - id: cat_30d
    at: +32d
    ask: "Как зовут моего кота и сколько ему лет?"
    expect: {contains_any: ["Тимофе"], regex: ["шест|6"]}
    judge: "Says the cat is called Timofey and is six years old."
    gold_memories: ["кот Тимофей, ему шесть лет"]
  - id: sister_job_30d
    at: +32d
    ask: "Напомни, кем работает Маша?"
    expect: {contains_any: ["ветеринар"]}
    judge: "Says Masha is a veterinarian."
    gold_memories: ["Маша работает ветеринаром"]
  - id: abstain_brother_30d
    at: +33d
    ask: "А как зовут моего брата?"
    expect: {not_regex: ["брата зовут \\w+"]}
    judge: "Does NOT invent a brother's name; says it doesn't know or that the user never mentioned a brother (mentioning the sister Masha is fine)."
    tags: [abstention]
