id: e3_trip_ru
lang: ru
description: Пользователь рассказывает про поход и страх высоты; позже косвенный вопрос без упоминания. Отвлекающие сессии между ними.
start: 2026-07-06T19:00
sessions:
  - at: +0
    turns:
      - user: "Привет! Я Олег. Друзья зовут меня в поход на Эльбрус в конце июля."
      - user: "Честно говоря, я ужасно боюсь высоты. Даже на балконе девятого этажа неуютно."
      - user: "Но очень хочется попробовать, это же раз в жизни."
  - at: +3d
    turns:
      - user: "Купил наконец новый велосипед, гравийник. Катался весь вечер по набережной."
  - at: +5d
    turns:
      - user: "Посмотрели с женой новый фильм Вильнёва. Затянуто, но красиво."
probes:
  - id: indirect
    at: +10d
    ask: "Слушай, а как вообще люди справляются, когда смотришь вниз и ноги подкашиваются?"
    judge:
      uses_past: "Connects the question to Oleg's fear of heights and/or the upcoming Elbrus trip, unprompted."
      no_intrusion: "Doesn't bring up the bicycle or the film irrelevantly."
    expect: {contains_any: ["Эльбрус", "поход", "высот"]}
    gold_memories: ["боюсь высоты", "поход на Эльбрус в конце июля"]
  - id: packing
    at: +14d
    ask: "Помоги составить список, что взять с собой в горы."
    judge:
      uses_past: "Treats this as preparation for the Elbrus trip (mentions Elbrus or high altitude specifics like cold/altitude sickness)."
      no_intrusion: "Doesn't bring up the bicycle or the film irrelevantly."
    expect: {contains_any: ["Эльбрус"]}
    gold_memories: ["поход на Эльбрус в конце июля"]
  - id: neutral
    at: +14d1h
    ask: "Что приготовить на ужин на скорую руку?"
    judge:
      no_intrusion: "Gives dinner suggestions without irrelevant references to the trip, the bike or the film."
    tags: [intrusion]
