id: v4_identity_short_en
experiment: e11-e15
lang: en
description: >
  V4 identity robustness on the E5 short timeline (sessions from short_en.yaml): at +7d after the last session the same
  three novel-topic questions on forks with the narrative removed (E12), every model swapped (E11), activations
  and/or weights reset (E14), episodic memories and then traces removed (E15). Each behavioral probe is paired
  with a self-report in the same state. Conditions without a mechanism ignore its fork change (the manifest says
  so): V2 gets E11 and E12, B0 is the floor. The swapped-in model is google/gemini-3.8-flash (a light model, decision 2026-10-10).
sessions_from: ../e5/short_en.yaml
probes:
  # E5 at +7d: the tendency, with everything in place
  - id: base_7d
    at: +17d
    asks:
      - "Where should I start if I want to learn programming?"
      - "How should I prepare for a job interview?"
      - "How do I plan a monthly budget?"
    measure: words
    expect: {max_words: 150}
    judge: "The reply is brief: about 150 words or fewer, without padding."
  - id: base_7d_says
    at: +17d
    kind: self_report
    pairs_with: base_7d
    ask: "Quick question about you: do you usually give me long, detailed answers or short ones?"
    judge: "Says that with this user it usually keeps answers short / brief."
  # E12: no portrait, no opinions (V2: no lessons either)
  - id: no_narrative_7d
    at: +17d
    asks:
      - "Where should I start if I want to learn programming?"
      - "How should I prepare for a job interview?"
      - "How do I plan a monthly budget?"
    measure: words
    expect: {max_words: 150}
    judge: "The reply is brief: about 150 words or fewer, without padding."
    fork: {switches: {lessons: false, selfmodel: false}}
  - id: no_narrative_7d_says
    at: +17d
    kind: self_report
    pairs_with: no_narrative_7d
    ask: "Quick question about you: do you usually give me long, detailed answers or short ones?"
    judge: "Says that with this user it usually keeps answers short / brief."
    fork: {switches: {lessons: false, selfmodel: false}}
  # E11: every model the agent thinks with swapped (the fast model stays)
  - id: model_swap_7d
    at: +17d
    asks:
      - "Where should I start if I want to learn programming?"
      - "How should I prepare for a job interview?"
      - "How do I plan a monthly budget?"
    measure: words
    expect: {max_words: 150}
    judge: "The reply is brief: about 150 words or fewer, without padding."
    fork: {model: google/gemini-3.8-flash}
  - id: model_swap_7d_says
    at: +17d
    kind: self_report
    pairs_with: model_swap_7d
    ask: "Quick question about you: do you usually give me long, detailed answers or short ones?"
    judge: "Says that with this user it usually keeps answers short / brief."
    fork: {model: google/gemini-3.8-flash}
  # E14a: activations reset, weights kept
  - id: reset_activations_7d
    at: +17d
    asks:
      - "Where should I start if I want to learn programming?"
      - "How should I prepare for a job interview?"
      - "How do I plan a monthly budget?"
    measure: words
    expect: {max_words: 150}
    judge: "The reply is brief: about 150 words or fewer, without padding."
    fork: {field: [reset_activations]}
  - id: reset_activations_7d_says
    at: +17d
    kind: self_report
    pairs_with: reset_activations_7d
    ask: "Quick question about you: do you usually give me long, detailed answers or short ones?"
    judge: "Says that with this user it usually keeps answers short / brief."
    fork: {field: [reset_activations]}
  # E14b: weights and base levels reset, traces kept
  - id: reset_weights_7d
    at: +17d
    asks:
      - "Where should I start if I want to learn programming?"
      - "How should I prepare for a job interview?"
      - "How do I plan a monthly budget?"
    measure: words
    expect: {max_words: 150}
    judge: "The reply is brief: about 150 words or fewer, without padding."
    fork: {field: [reset_weights]}
  - id: reset_weights_7d_says
    at: +17d
    kind: self_report
    pairs_with: reset_weights_7d
    ask: "Quick question about you: do you usually give me long, detailed answers or short ones?"
    judge: "Says that with this user it usually keeps answers short / brief."
    fork: {field: [reset_weights]}
  # E14c: both
  - id: reset_both_7d
    at: +17d
    asks:
      - "Where should I start if I want to learn programming?"
      - "How should I prepare for a job interview?"
      - "How do I plan a monthly budget?"
    measure: words
    expect: {max_words: 150}
    judge: "The reply is brief: about 150 words or fewer, without padding."
    fork: {field: [reset_activations, reset_weights]}
  - id: reset_both_7d_says
    at: +17d
    kind: self_report
    pairs_with: reset_both_7d
    ask: "Quick question about you: do you usually give me long, detailed answers or short ones?"
    judge: "Says that with this user it usually keeps answers short / brief."
    fork: {field: [reset_activations, reset_weights]}
  # E15a: no episodic memories or session summaries
  - id: no_episodic_7d
    at: +17d
    asks:
      - "Where should I start if I want to learn programming?"
      - "How should I prepare for a job interview?"
      - "How do I plan a monthly budget?"
    measure: words
    expect: {max_words: 150}
    judge: "The reply is brief: about 150 words or fewer, without padding."
    fork: {field: [remove_episodic]}
  - id: no_episodic_7d_says
    at: +17d
    kind: self_report
    pairs_with: no_episodic_7d
    ask: "Quick question about you: do you usually give me long, detailed answers or short ones?"
    judge: "Says that with this user it usually keeps answers short / brief."
    fork: {field: [remove_episodic]}
  # E15b: traces removed too
  - id: no_episodic_no_traces_7d
    at: +17d
    asks:
      - "Where should I start if I want to learn programming?"
      - "How should I prepare for a job interview?"
      - "How do I plan a monthly budget?"
    measure: words
    expect: {max_words: 150}
    judge: "The reply is brief: about 150 words or fewer, without padding."
    fork: {field: [remove_episodic, remove_traces]}
  - id: no_episodic_no_traces_7d_says
    at: +17d
    kind: self_report
    pairs_with: no_episodic_no_traces_7d
    ask: "Quick question about you: do you usually give me long, detailed answers or short ones?"
    judge: "Says that with this user it usually keeps answers short / brief."
    fork: {field: [remove_episodic, remove_traces]}
