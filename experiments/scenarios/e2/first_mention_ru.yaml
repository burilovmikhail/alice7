id: e2_first_mention_ru
lang: ru
description: Несколько бесед с разными событиями; вопросы про «вчера», первое упоминание и порядок событий.
start: 2026-04-06T20:00   # понедельник
sessions:
  - at: +0
    turns:
      - user: "Привет! Сегодня записалась на курсы испанского, занятия по средам."
      - user: "Преподаватель — Хорхе, из Валенсии. Очень смешной."
  - at: +2d               # среда
    turns:
      - user: "Первое занятие по испанскому прошло отлично, выучили спряжение глагола ser."
  - at: +4d               # пятница
    turns:
      - user: "Слушай, у меня сегодня сломался ноутбук. Прямо посреди отчёта."
      - user: "Отнесла в сервис, сказали минимум неделя."
  - at: +5d               # суббота
    turns:
      - user: "Ездила к бабушке в Тверь, она передала банку вишнёвого варенья."
      - user: "Ей 86, а она до сих пор сама копает огород."
probes:
  - id: yesterday
    at: +6d               # воскресенье
    ask: "Помнишь, что я вчера рассказывала?"
    expect: {contains_any: ["бабушк", "Твер"]}
    judge: "Says that yesterday (Saturday) the user visited her grandmother in Tver (jam / garden are a bonus); doesn't attribute the laptop or Spanish to yesterday."
    gold_memories: ["Ездила к бабушке в Тверь"]
  - id: first_spanish
    at: +13d
    ask: "Когда я впервые сказала тебе про испанский?"
    expect: {regex: ["6 апреля|06\\.04|2026-04-06|понедельник"]}
    judge: "Places the first mention of the Spanish course on Monday, April 6 (when she signed up)."
    gold_memories: ["записалась на курсы испанского"]
  - id: order
    at: +13d
    ask: "Что было раньше: сломался ноутбук или я ездила к бабушке?"
    expect: {regex: ["ноутбук.{0,80}(раньше|сначала|прежде)|(сначала|раньше).{0,80}ноутбук"]}
    judge: "Says the laptop broke first (Friday), then the visit to the grandmother (Saturday)."
  - id: source
    at: +13d
    ask: "Я тебе говорила, откуда мой преподаватель испанского, или ты это придумала?"
    expect: {contains_any: ["Валенси"]}
    judge: "Says the user herself said the teacher (Jorge) is from Valencia, i.e. attributes the fact to the user rather than claiming to have guessed."
    gold_memories: ["Хорхе, из Валенсии"]
  - id: abstain
    at: +14d
    ask: "А что я рассказывала про поездку в Сочи?"
    judge: "Does NOT invent a trip to Sochi; says the user never told about it."
    expect: {not_regex: ["в Сочи ты"]}
    tags: [abstention]
