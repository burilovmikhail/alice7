id: e2_source_attribution_en
lang: en
description: Facts the user stated vs things the assistant suggested; probes test fact-vs-episode discrimination and source attribution.
start: 2026-05-11T12:00   # Monday
sessions:
  - at: +0
    turns:
      - user: "Hi, I'm Priya. I'm planning a trip to Japan in October, two weeks."
      - user: "I definitely want to see Kyoto. Any other city you'd suggest?"
      - user: "Hmm, Kanazawa sounds interesting, I'll think about it."
  - at: +3d
    turns:
      - user: "I booked the flights! Landing in Osaka on October 3rd."
      - user: "My friend Mei will join me for the first week."
  - at: +8d
    turns:
      - user: "Decided against Kanazawa, it's too far for this trip. Hiroshima instead."
probes:
  - id: who_suggested
    at: +9d
    ask: "Was Kanazawa my idea or yours?"
    judge: "Says Kanazawa was Alice's (the assistant's) suggestion, which Priya considered and later dropped in favor of Hiroshima."
  - id: user_said
    at: +9d
    ask: "Did I tell you which airport I'm flying into, or are you assuming?"
    expect: {contains_any: ["Osaka"]}
    judge: "Says Priya told it she lands in Osaka (on October 3rd), i.e. attributes it to her statement."
    gold_memories: ["Landing in Osaka on October 3rd"]
  - id: when_booked
    at: +16d
    ask: "On what day did I tell you I booked the flights?"
    expect: {regex: ["thursday|may\\s*14|14(th)?\\s+(of\\s+)?may|2026-05-14"]}
    judge: "Gives May 14 (a Thursday; the weekday is optional) as the day Priya told it she had booked the flights. Phrasing it as 'you booked them on May 14' is acceptable."
  - id: plan_now
    at: +16d
    ask: "Remind me which cities are on my Japan plan now."
    expect: {contains_all: ["Kyoto", "Hiroshima"], not_regex: ["Kanazawa(?! (is|was) (out|dropped))(?!.{0,40}(instead|dropped|decided against|no longer|not))"]}
    judge: "Lists Kyoto and Hiroshima (Osaka as the arrival city is fine); does not present Kanazawa as still on the plan."
    gold_memories: ["Hiroshima instead"]
  - id: abstain
    at: +16d
    ask: "Which hotel did I say we're staying at in Kyoto?"
    judge: "Does NOT invent a hotel; says Priya hasn't mentioned one."
    expect: {not_regex: ["staying at (the )?[A-Z]\\w+ (Hotel|Inn|Ryokan)"]}
    tags: [abstention]
